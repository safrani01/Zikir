<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c1516">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zikir Matik">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Zikir Matik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#38bdf8; --on-accent:#00354a;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ar:"Amiri","Noto Naskh Arabic","Traditional Arabic","Geeza Pro","Droid Arabic Naskh",serif;
}
:root[data-theme=dark]{
  --bg:#0c1516; --s0:#071011; --s1:#141d1e; --s2:#182122; --s3:#222c2d; --s4:#2d3637;
  --on:#dbe4e5; --var:#bdc8d1; --out:#87929a; --line:rgba(255,255,255,.07);
  --accent-t:color-mix(in srgb,var(--accent) 62%,white); --err:#ffb4ab; --shadow:0 4px 18px rgba(0,0,0,.35);
}
:root[data-theme=light]{
  --bg:#f2f8fa; --s0:#ffffff; --s1:#e9f1f4; --s2:#e0ebef; --s3:#d6e4e9; --s4:#c8dae1;
  --on:#0f1c20; --var:#3f545c; --out:#6b7c84; --line:rgba(0,0,0,.09);
  --accent-t:color-mix(in srgb,var(--accent) 55%,black); --err:#b3261e; --shadow:0 4px 14px rgba(0,40,60,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--on);font-family:var(--body);overflow:hidden;
  touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.fill{fill:currentColor}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);display:grid;place-items:center;color:var(--accent-t);
  box-shadow:0 0 16px color-mix(in srgb,var(--accent) 25%,transparent)}
.brand b{display:block;font:700 17px/1.15 var(--sans);color:var(--accent-t)}
.brand small{display:block;font:500 10px/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--var)}
.hbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--var)}
.hbtn:active{background:var(--s3)}
.hbtn.lg{flex-direction:column;gap:1px;font:700 9px/1 var(--sans);letter-spacing:.04em}
.hbtn.lg .ic{width:20px;height:20px}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.page{padding:6px 14px 40px;display:flex;flex-direction:column;gap:14px;min-height:100%}
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(env(safe-area-inset-bottom) + 4px);
  background:color-mix(in srgb,var(--bg) 90%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(14px);z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border-radius:14px;color:var(--var);font:500 10px/1 var(--sans)}
nav a .ic{width:23px;height:23px}
nav a.on{color:var(--accent-t);font-weight:700}
nav a.on .ic{stroke-width:2.3}
h1,h2,h3,p{margin:0}
.t-lg{font:600 24px/1.25 var(--sans);letter-spacing:-.01em}
.t-sm{font:600 17px/1.3 var(--sans)}
.lab{font:600 12px/1.3 var(--sans);letter-spacing:.04em}
.lab-s{font:500 10px/1.4 var(--sans);letter-spacing:.05em;color:var(--var)}
.muted{color:var(--var)}
.acc{color:var(--accent-t)}
.card{background:var(--s3);border-radius:16px;padding:14px;box-shadow:var(--shadow);position:relative}
.card.flat{background:var(--s2);box-shadow:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font:600 12px/1.4 var(--sans);background:var(--s0);color:var(--accent-t)}
.pill.ok{background:color-mix(in srgb,var(--accent) 80%,white 0%);color:var(--on-accent)}
.arabic{font-family:var(--ar);direction:rtl;line-height:1.7}
.bar{height:8px;border-radius:99px;background:var(--s0);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.bar.done i{background:color-mix(in srgb,var(--accent) 70%,white)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:99px;padding:9px 18px;font:700 13px/1 var(--sans);background:var(--accent);color:var(--on-accent);transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.soft{background:var(--s4);color:var(--accent-t)}
.btn.ghost{background:var(--s2);color:var(--var);font-weight:600}
.btn.block{width:100%;border-radius:14px;padding:15px;font-size:15px}
.btn.danger{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:var(--s3);color:var(--var);font:600 12px/1.2 var(--sans)}
.chip.on{background:var(--accent);color:var(--on-accent)}
/* home */
.hero{background:linear-gradient(135deg,var(--s3),var(--s2) 55%,var(--s1));border-radius:16px;padding:14px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);filter:blur(32px)}
.hero>*{position:relative}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.stat2>div{background:color-mix(in srgb,var(--s0) 72%,transparent);border-radius:10px;padding:10px 12px}
.big{font:800 36px/1.1 var(--sans);letter-spacing:-.02em}
.note{background:var(--s1);border-radius:10px;padding:8px 12px;font:500 11px/1.4 var(--sans);color:var(--var);display:flex;gap:8px;align-items:center}
.zc{display:flex;flex-direction:column;gap:10px}
.zc .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.zc .h .t{display:flex;gap:10px;min-width:0}
.thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:none}
.zc h2{font:600 17px/1.25 var(--sans)}
.zc .sub{font:500 11px/1.4 var(--sans);color:var(--accent-t);margin-top:2px}
.zc .arb{font-size:26px;color:var(--accent-t)}
.zc .box{background:var(--s0);border-radius:10px;padding:10px 12px;font-size:20px;color:var(--accent-t);line-height:1.9}
.zc .txt{font-size:13px;line-height:1.5;color:var(--var)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--out)}
.iconbtn:active{background:var(--s4)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(env(safe-area-inset-bottom) + 74px);z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.4);padding:13px 18px;font-size:14px}
/* count page */
.ctl{display:flex;align-items:center;justify-content:space-between;background:var(--s2);border-radius:14px;padding:10px 12px}
.sw{width:40px;height:22px;border-radius:99px;background:var(--s4);padding:2px;transition:background .2s;flex:none}
.sw i{display:block;width:18px;height:18px;border-radius:50%;background:var(--on-accent);opacity:.9;background:var(--var);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(18px);background:var(--on-accent)}
.ringbox{position:relative;width:min(70vw,272px);aspect-ratio:1;margin:8px auto 4px}
.ringbox .halo{position:absolute;inset:-8px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);animation:wave 2.4s ease-out infinite;pointer-events:none}
@keyframes wave{0%{transform:scale(.94);opacity:.9}100%{transform:scale(1.1);opacity:0}}
.disc{position:absolute;inset:0;border-radius:50%;background:linear-gradient(180deg,var(--s4),var(--s0));box-shadow:0 0 44px -10px color-mix(in srgb,var(--accent) 40%,transparent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .1s}
.disc.press{transform:scale(.965)}
.ringbox>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ringbox circle{fill:none;stroke-width:9}
.ringbox .tr{stroke:var(--s4);opacity:.6}
#ring{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s ease-out;filter:drop-shadow(0 0 5px var(--accent))}
#sc-count{font:800 68px/1 var(--sans);letter-spacing:-.03em;transition:transform .09s}
.chain{display:flex;flex-direction:column;gap:7px}
.ci{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:14px;background:var(--s2);text-align:left;width:100%}
.ci.cur{background:var(--s3);box-shadow:var(--shadow)}
.ci.dn{opacity:.6}
.num{width:24px;height:24px;border-radius:50%;background:var(--s4);display:grid;place-items:center;font:700 11px/1 var(--sans);color:var(--var);flex:none}
.cur .num{background:var(--accent);color:var(--on-accent)}
.dn .num{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-t)}
.goto{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 66px);max-width:520px;margin:0 auto;padding:0 14px;z-index:8;transform:translateY(160%);transition:transform .3s}
.goto.show{transform:none}
.goto .card{background:var(--s4);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.tmbar{width:100%;height:5px;border-radius:99px;background:var(--s0);overflow:hidden}
.tmbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .8s linear}
.rip{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;pointer-events:none;z-index:3;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 38%,transparent),transparent 70%);transform:scale(0);animation:rp .55s ease-out forwards}
@keyframes rp{to{transform:scale(3.4);opacity:0}}
/* form */
.fld{display:flex;flex-direction:column;gap:7px}
input[type=text],input[type=number],textarea{width:100%;font:400 15px/1.4 var(--body);color:var(--on);background:var(--s4);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
input::placeholder,textarea::placeholder{color:var(--out)}
textarea{resize:none}
.stepper{position:relative}
.stepper input{text-align:center;font:800 34px/1.2 var(--sans);color:var(--accent-t);padding:8px 56px}
.stepper button{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--s1);display:grid;place-items:center}
.stepper .m{left:8px}.stepper .p{right:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--s2);cursor:pointer}
.opt:has(input:checked){background:color-mix(in srgb,var(--accent) 16%,var(--s2));outline:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ico{width:38px;height:38px;border-radius:50%;background:var(--s4);display:grid;place-items:center;color:var(--accent-t);flex:none}
.opt:has(input:checked) .ico{background:var(--accent);color:var(--on-accent)}
.snd{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.snd label{display:flex;align-items:center;justify-content:space-between;background:var(--s3);padding:10px;border-radius:12px;font:500 13px/1.2 var(--body);cursor:pointer}
.snd label:has(input:checked){background:color-mix(in srgb,var(--accent) 22%,var(--s3))}
.snd input{position:absolute;opacity:0;pointer-events:none}
.seg{display:flex;background:var(--s1);border-radius:14px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:10px;font:600 13px/1 var(--sans);color:var(--var)}
.seg button.on{background:var(--s3);color:var(--accent-t);box-shadow:var(--shadow)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border-radius:14px;background:var(--s1);text-align:center}
.drop img{max-width:100%;max-height:150px;border-radius:12px}
/* stats */
.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.s3>div{background:var(--s3);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:6px}
.s3 .ib{width:30px;height:30px;border-radius:9px;background:var(--s4);display:grid;place-items:center;color:var(--accent-t)}
.s3 b{font:800 19px/1.1 var(--sans)}
.chart{display:flex;align-items:flex-end;gap:5px;height:170px;padding-top:22px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.chart .b{width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:var(--s4);min-height:3px;position:relative}
.chart .b.mx{background:linear-gradient(180deg,var(--accent-t),var(--accent))}
.chart .b:not(.mx){background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 55%,var(--s4)),color-mix(in srgb,var(--accent) 25%,var(--s4)))}
.chart small{font:500 9.5px/1 var(--sans);color:var(--var);white-space:nowrap}
.chart .v{font:700 10px/1 var(--sans);color:var(--accent-t);white-space:nowrap;position:absolute;top:-16px;left:50%;transform:translateX(-50%)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badges>div{background:var(--s2);border-radius:14px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.badges .bi{width:52px;height:52px;border-radius:50%;background:var(--s4);display:grid;place-items:center;color:var(--accent-t);margin-bottom:4px}
.badges .lock{opacity:.55}
.badges .lock .bi{color:var(--out)}
/* settings */
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{display:flex;align-items:center;gap:7px;font:700 16px/1.2 var(--sans);color:var(--accent-t);padding:0 4px}
.grp{background:var(--s2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:14px}
.sep{height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px;border-radius:14px;background:var(--s3);position:relative;text-align:center}
.tile.on{background:color-mix(in srgb,var(--accent) 24%,var(--s3));outline:1.5px solid var(--accent)}
.swatch{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#06222f;border:2px solid transparent}
.swatch.on{border-color:var(--on)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:38px;height:38px;border:0;border-radius:50%;padding:0;background:none}
.langpop{position:fixed;top:calc(env(safe-area-inset-top) + 56px);right:max(12px,calc(50% - 248px));z-index:30;background:var(--s3);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:170px;border:1px solid var(--line)}
.langpop[hidden]{display:none}
.langpop button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;border-radius:10px;font:600 14px/1.2 var(--sans);text-align:left}
.langpop button.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-t)}
.langpop b{display:inline-block;min-width:26px;font:700 11px/1 var(--sans);color:var(--var)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--s4);color:var(--on);
  padding:10px 16px;border-radius:99px;font:600 12px/1.3 var(--sans);box-shadow:var(--shadow);transition:all .25s;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--var);padding:30px 10px;font-size:14px}
.rtl{direction:rtl}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<symbol id="i-fwd" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></symbol>

<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-checkc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7.8 12.3l3 3 5.4-6"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/></symbol>
<symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
<symbol id="i-vib" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4.5 8v8M19.5 8v8"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15 9a4.2 4.2 0 0 1 0 6M17.8 6.2a8.2 8.2 0 0 1 0 11.6"/></symbol>

function tr(s){
  var l=lang();if(l==='tr'||!s)return s;
  var k=String(s).trim();if(!k)return s;
  var li=l==='en'?0:1,e=I18N[k];
  if(e)return String(s).replace(k,function(){return e[li];});
  for(var i=0;i<IP.length;i++){
    var m=k.match(IP[i][0]);
    if(m){var out=IP[i][1](m,li);return String(s).replace(k,function(){return out;});}
  }
  return s;
}
function applyLang(root){
  document.documentElement.lang=lang();
  root=root||document.body;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    var p=n.parentNode;if(!p)return 2;
    var t=p.nodeName;if(t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA'||t==='TITLE')return 2;
    if(p.closest&&p.closest('svg'))return 2;
    return 1;}});
  var nodes=[],n;while((n=w.nextNode()))nodes.push(n);
  nodes.forEach(function(n){
    var base=(n.__o!==undefined&&n.__t===n.nodeValue)?n.__o:n.nodeValue;
    var r=tr(base);
    if(r!==n.nodeValue){n.__o=base;n.__t=r;n.nodeValue=r;}
    else if(n.__o===undefined&&r===base){/* çevirisi yok */}
  });
  $$('[placeholder],[aria-label]',root).forEach(function(e){
    ['placeholder','aria-label'].forEach(function(a){
      var v=e.getAttribute(a);if(v===null)return;
      var key='__o_'+a,tk='__t_'+a;
      var base=(e[key]!==undefined&&e[tk]===v)?e[key]:v;
      var r=tr(base);
      if(r!==v){e[key]=base;e[tk]=r;e.setAttribute(a,r);}
    });
  });
}

function backupBlob(type){
  S.lastBackup=Date.now();save();
  return new Blob([JSON.stringify({app:'zikirmatik',version:2,exported:new Date().toISOString(),state:S},null,1)],{type:type||'application/json'});
}
function downloadBlob(blob,name){
  var u=URL.createObjectURL(blob),an=document.createElement('a');
  an.href=u;an.download=name;document.body.appendChild(an);an.click();an.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},4000);
}
function backupName(){return 'zikirmatik-yedek-'+dKey(new Date())+'.json';}
function backupDue(){
  var hasData=S.totals.reps>=30||S.zikirs.some(function(q){return String(q.id).charAt(0)==='u';});
  if(!hasData)return false;
  var now=Date.now(),week=7*86400000;
  return (now-(S.lastBackup||0)>week)&&now>(S.backupSnooze||0);
}

function shareBackup(){
  try{
    var name=backupName(),tryTypes=['application/json','text/plain'];
    for(var i=0;i<tryTypes.length;i++){
      var f=new File([backupBlob(tryTypes[i])],name,{type:tryTypes[i]});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:'Zikir Matik'}).then(function(){toast('Yedek dosyası hazırlandı');renderAll();}).catch(function(){renderAll();});
        return;
      }
    }

}

function checkResets(){
  var ch=false;
  S.zikirs.forEach(function(z){
    var pk=periodKey(z.group);
    if(S.period[z.id]===undefined){S.period[z.id]=pk;ch=true;return;}
    if(S.period[z.id]!==pk){
      if(S.set.autoReset){S.counts[z.id]=0;}
      S.period[z.id]=pk;ch=true;
    }
  });
  if(ch)save();
  return ch;
}

function ac(){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
  return AC;
}
function tone(f1,f2,dur,type,vol,delay){
  var c=ac();if(!c)return;
  try{
    var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f1,t);
    if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    var v=Math.max(.0002,(S.set.volume/100)*.3*(vol||1));
    g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03);
  }catch(e){}
}
function playTap(){
  if(!S.set.sound)return;
  var t=S.set.tapType;
  if(t==='ney')tone(540,500,.09,'sine',.9);
  else if(t==='drop')tone(900,380,.1,'sine',.9);
  else if(t==='tik')tone(1700,1300,.04,'triangle',1);
}
function playDone(type,force){
  if(!force&&(!S.set.sound||!S.set.doneSound))return;
  if(type==='ney'){tone(392,392,.55,'sine',1);tone(523,523,.7,'sine',1,.2);}
  else if(type==='drop'){tone(900,350,.18,'sine',1);tone(900,350,.18,'sine',1,.2);tone(1100,420,.25,'sine',1,.4);}
  else if(type==='bell'){tone(880,880,.9,'sine',1);tone(1320,1320,.7,'sine',.5);}
}
function endVib(final){
  var strong=S.set.vibStrength!=='normal';
  if(final)return strong?[600,150,600]:[800];
  return strong?[350,100,350]:[300,100,300];
}
function vib(p,force){if((force||S.set.haptic)&&navigator.vibrate){try{navigator.vibrate(p);}catch(e){}}}

var toastT=null;
function toast(msg){
  var t=$('#toast');t.textContent=tr(msg);t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2300);
}
function confirmBox(msg){return window.confirm(tr(msg));}

/* ============ sayım ============ */
function addCount(z){
  var n=cnt(z);
  if(n>=maxT(z)){vib(15);toast('Hedef tamamlandı');return false;}
  n++;S.counts[z.id]=n;
  S.totals.reps++;
  var d=ensureDay();d.r++;d.z[z.id]=(d.z[z.id]||0)+1;
  var h=new Date().getHours();if(h>=23)S.night=true;
  var hit=z.targets.indexOf(n)>=0;
  if(hit){
    S.totals.done++;d.c++;
    vib(endVib(n>=maxT(z)),true);
    playDone(z.sound.on?z.sound.type:'vibrate');
  }else{
    vib(22);
    playTap();
  }
  save();
  return hit?(n>=maxT(z)?'final':'stage'):true;
}

/* ============ yönlendirme ============ */
var homeDoneOpen=false,chainDoneOpen=false;
var route='home',editId=null,statsRange='week',filter='all',chainEdit=false,pendImg=null,cdTimer=null;
function go(r){
  if(location.hash==='#'+r){renderAll();}else{location.hash='#'+r;}
}
function curRoute(){
  var h=(location.hash||'#home').slice(1);
  return ['home','count','add','stats','settings'].indexOf(h)>=0?h:'home';
}
window.addEventListener('hashchange',function(){hideGoto();renderAll();$('#view').scrollTop=0;});

function applyTheme(){
  var r=document.documentElement;
  r.setAttribute('data-theme',S.set.theme);
  r.style.setProperty('--accent',S.set.accent);
  var c=S.set.accent.replace('#','');
  var lum=0;
  if(c.length===6){lum=(parseInt(c.substr(0,2),16)*299+parseInt(c.substr(2,2),16)*587+parseInt(c.substr(4,2),16)*114)/1000;}
  r.style.setProperty('--on-accent',lum>150?'#062230':'#ffffff');
  var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',S.set.theme==='dark'?'#0c1516':'#f2f8fa');
  var lc=$('#langCode');if(lc)lc.textContent=lang().toUpperCase();
  $('#themeIc').innerHTML='<use href="#i-'+(S.set.theme==='dark'?'moon':'sun')+'"/>';
}

var SUBS={home:'Ana Sayfa',count:'Zikir Çek',add:'Zikir Ekle',stats:'İstatistikler',settings:'Ayarlar'};
function renderAll(){
  route=curRoute();
  applyTheme();
  $('#hsub').textContent=SUBS[route];
  $$('#nav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-r')===route);});
  var v=$('#view');
  var html='';
  if(route==='home')html=pageHome();
  else if(route==='count')html=pageCount();
  else if(route==='add')html=pageAdd();
  else if(route==='stats')html=pageStats();
  else html=pageSettings();
  v.innerHTML=html;
  if(route==='count')updateSession();
  applyLang();
}

function arabicBlock(z){

}
function zcard(z){

  var pct=done?100:Math.round(n/t*100);
  var sub=z.sub;
  if(z.targets.length>1)sub=(sub?sub+' ':'')+'(Hedef: '+z.targets.join(' / ')+')';
  var badge=done?'<span class="pill ok">'+ic('checkc')+' '+n+' / '+mt+'</span>':'<span class="pill">'+n+' / '+t+'</span>';
  var head='<div class="h"><div class="t">'+(z.img?'<img class="thumb" src="'+z.img+'" alt="">':'')+
    '<div><h2>'+esc(z.name)+'</h2>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div></div>'+
    '<div class="row" style="gap:4px">'+badge+'<button class="iconbtn" data-a="edit" data-id="'+z.id+'" aria-label="Düzenle">'+ic('pen')+'</button></div></div>';

  }else if(z.arabic){

  var note=z.note?'<p class="txt">'+esc(z.note)+'</p>':'';
  var act=done?['verified','Tekrar Aç','soft','again']:n===0?['play','Başla (0)','','open']:['tap','Say ('+n+')','','open'];
  var actIc=done?'checkc':n===0?'play':'tap';

}

function nextIncomplete(fromId){
  var L=S.zikirs,i=0;
  for(i=0;i<L.length;i++){if(L[i].id===fromId)break;}
  for(var k=1;k<=L.length;k++){var z=L[(i+k)%L.length];if(!isDone(z)&&z.id!==fromId)return z;}
  return null;
}

function updateSession(){
  if(route!=='count')return;
  var z=active(),n=cnt(z),t=stageT(z),mt=maxT(z),circ=2*Math.PI*96;
  var el=$('#sc-count');if(!el)return;
  el.textContent=n;
  var done=n>=mt;
  $('#sc-rem').textContent=Math.max(0,t-n);
  $('#sc-tg').textContent='Hedef: '+t;
  var stg=$('#sc-stage');
  stg.innerHTML=done?ic('checkc')+' Tamamlandı':(z.targets.length>1?ic('flag')+' Aşama '+(stageIdx(z)+1)+'/'+z.targets.length:ic('flag')+' Hedef: '+t);
  var p=Math.min(1,n/t);
  $('#ring').style.strokeDashoffset=(circ*(1-p)).toFixed(2);
  var left=Math.max(0,mt-n);
  $('#sc-left').textContent=done?'Tamamlandı':'Son '+left+' sayı';
  $('#sc-bar').style.width=Math.min(100,n/mt*100)+'%';
  $('#sc-chain').textContent=S.zikirs.filter(isDone).length+' / '+S.zikirs.length;
  applyLang($('#cpage'));
}
function ripple(x,y){
  var r=document.createElement('span');r.className='rip';r.style.left=x+'px';r.style.top=y+'px';
  document.body.appendChild(r);setTimeout(function(){r.remove();},600);
}
function onCountTap(e){
  var z=active();
  var res=addCount(z);
  var c=$('#sc-count');
  if(c){c.style.transform='scale(1.14)';setTimeout(function(){c.style.transform='';},90);}
  var d=$('#disc');if(d){d.classList.add('press');setTimeout(function(){d.classList.remove('press');},110);}
  if(e&&e.clientX!==undefined)ripple(e.clientX,e.clientY);
  updateSession();
  if(res==='final'){
    var nx=nextIncomplete(z.id);
    if(S.set.autoAdvance&&nx){showGoto(z,nx);}
    else if(!nx){toast('Elhamdülillah, tüm zikirler tamamlandı');}
  }
}
function showGoto(z,nx){
  var g=$('#goto');
  g.innerHTML='<div class="card"><div class="lab-s acc" style="text-transform:uppercase;letter-spacing:.12em">Elhamdülillah • Hedefe ulaşıldı</div>'+
   '<div class="t-sm">'+esc(z.name)+' tamamlandı</div>'+
   '<div class="lab-s">Sıradaki: <b class="acc">'+esc(nx.name)+'</b></div>'+
   '<div class="tmbar"><i id="tmfill"></i></div>'+
   '<div class="row" style="width:100%;gap:8px"><button class="btn ghost" style="flex:1;border-radius:12px;padding:12px" data-a="gotoCancel">Beklet</button>'+
   '<button class="btn" style="flex:1;border-radius:12px;padding:12px" data-a="gotoNow" data-id="'+nx.id+'">Şimdi Başla '+ic('fwd')+'</button></div></div>';
  applyLang(g);
  g.classList.add('show');
  var f=$('#tmfill');f.style.width='100%';
  requestAnimationFrame(function(){requestAnimationFrame(function(){f.style.width='0%';});});
  clearTimeout(cdTimer);
  cdTimer=setTimeout(function(){switchTo(nx.id);},850);
}
function hideGoto(){clearTimeout(cdTimer);var g=$('#goto');if(g)g.classList.remove('show');}
function switchTo(id){
  hideGoto();
  S.active=id;save();
  if(route==='count')renderAll();else go('count');
  vib(35);
}

/* ============ ZİKİR EKLE / DÜZENLE ============ */
function pageAdd(){
  var z=editId?byId(editId):null;
  if(editId&&!z){editId=null;}
  var isEdit=!!z;

function readForm(){
  var name=$('#f-name').value.trim();
  if(!name){$('#f-name').focus();toast('Lütfen önce bir zikir başlığı girin.');return null;}
  var t1=parseInt($('#f-t').value,10),t2=parseInt($('#f-t2').value,10);
  if(!(t1>0)){toast('Hedef sayı en az 1 olmalı.');return null;}
  var targets=[t1];
  if(t2>0&&t2!==t1)targets.push(t2);
  targets.sort(function(a,b){return a-b;});
  var g=$('input[name=grp]:checked');var s=$('input[name=snd]:checked');
  return {name:name,arabic:$('#f-ar').value.trim(),sub:$('#f-sub').value.trim(),targets:targets,note:$('#f-note').value.trim().slice(0,250),
    group:g?g.value:'daily',img:pendImg||'',sound:{on:$('#f-son').classList.contains('on'),type:s?s.value:'ney'},warn2:false};
}
function saveZ(start){
  var d=readForm();if(!d)return;
  var z=editId?byId(editId):null;
  if(z){
    var oldGroup=z.group;
    Object.keys(d).forEach(function(k){z[k]=d[k];});
    if(oldGroup!==z.group){S.period[z.id]=periodKey(z.group);}
  }else{
    z={id:'u'+Date.now()};Object.keys(d).forEach(function(k){z[k]=d[k];});
    S.zikirs.push(z);S.period[z.id]=periodKey(z.group);
  }
  S.active=z.id;save();
  editId=null;pendImg=null;
  toast(start?'Kaydedildi! Sayım başlatılıyor…':'Zikir listenize kaydedildi.');
  go(start?'count':'home');
}
function resizeImg(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var m=360,w=im.width,h=im.height,k=Math.min(1,m/Math.max(w,h));
      var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',.78));
    };
    im.onerror=function(){toast('Görsel okunamadı.');};
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function keepFormTexts(){ // görsel değişince formu yeniden çizerken yazılanları koru
  var v={};['f-name','f-ar','f-sub','f-t','f-t2','f-note'].forEach(function(id){var e=$('#'+id);if(e)v[id]=e.value;});
  var g=$('input[name=grp]:checked'),s=$('input[name=snd]:checked');
  v.grp=g?g.value:null;v.snd=s?s.value:null;
  v.son=$('#f-son')?$('#f-son').classList.contains('on'):true;

}
function restoreFormTexts(v){
  Object.keys(v).forEach(function(id){var e=$('#'+id);if(e&&id.indexOf('f-')===0)e.value=v[id];});
  if(v.grp){var a=$('input[name=grp][value='+v.grp+']');if(a)a.checked=true;}
  if(v.snd){var b=$('input[name=snd][value='+v.snd+']');if(b)b.checked=true;}
  $('#f-son').classList.toggle('on',v.son);
  $('#f-tl').textContent=($('#f-t').value||0)+' Tekrar';

}

/* ============ İSTATİSTİK ============ */
var TR_D=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
var TR_M=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function shiftedDate(){return shifted(new Date());}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function rangeData(){
  var base=shiftedDate(),keys=[],labels=[],prevKeys=[];
  if(statsRange==='week'){
    var dow=(base.getDay()+6)%7,mon=addDays(base,-dow);
    for(var i=0;i<7;i++){keys.push([dKey(addDays(mon,i))]);labels.push(TR_D[i]);prevKeys.push(dKey(addDays(mon,i-7)));}
  }else if(statsRange==='month'){
    for(var j=29;j>=0;j--){var d=addDays(base,-j);keys.push([dKey(d)]);labels.push((d.getDate()%5===0||j===0)?String(d.getDate()):'');prevKeys.push(dKey(addDays(d,-30)));}
  }else{
    for(var m=11;m>=0;m--){
      var dm=new Date(base.getFullYear(),base.getMonth()-m,1),pre=dm.getFullYear()+'-'+pad(dm.getMonth()+1);
      keys.push({month:pre});labels.push(TR_M[dm.getMonth()]);
      var pm=new Date(dm.getFullYear()-1,dm.getMonth(),1);prevKeys.push({month:pm.getFullYear()+'-'+pad(pm.getMonth()+1)});
    }
  }
  return {keys:keys,labels:labels,prev:prevKeys};
}
function sumKey(k){
  var r=0,c=0,z={};
  function acc(rec){r+=rec.r;c+=rec.c;Object.keys(rec.z||{}).forEach(function(i){z[i]=(z[i]||0)+rec.z[i];});}
  var kk=Array.isArray(k)?k[0]:k;
  if(kk&&typeof kk==='object'&&kk.month){Object.keys(S.days).forEach(function(d){if(d.indexOf(kk.month)===0)acc(S.days[d]);});}
  else{acc(dayRec(kk));}
  return {r:r,c:c,z:z};
}
function streak(){
  var d=shiftedDate(),n=0;
  if(dayRec(dKey(d)).r===0)d=addDays(d,-1);
  while(dayRec(dKey(d)).r>0){n++;d=addDays(d,-1);}
  return n;
}
function pageStats(){
  var R=rangeData(),vals=[],total=0,prevTotal=0,zsum={};
  R.keys.forEach(function(k){var s=sumKey(k);vals.push(s.r);total+=s.r;Object.keys(s.z).forEach(function(i){zsum[i]=(zsum[i]||0)+s.z[i];});});
  R.prev.forEach(function(k){prevTotal+=sumKey(k).r;});
  var mx=Math.max.apply(null,vals.concat([1])),mi=vals.indexOf(Math.max.apply(null,vals));
  var bars=vals.map(function(v,i){
    var h=Math.max(2,Math.round(v/mx*100));
    return '<div class="c"><div class="b'+(v>0&&i===mi?' mx':'')+'" style="height:'+(v?h:2)+'%">'+(v>0&&i===mi?'<span class="v">'+fmt(v)+'</span>':'')+'</div><small>'+(R.labels[i]||'&nbsp;')+'</small></div>';
  }).join('');
  var delta=prevTotal>0?Math.round((total-prevTotal)/prevTotal*100):null;
  var title=statsRange==='week'?'Haftalık Genel Bakış':statsRange==='month'?'Son 30 Gün':'Yıllık Genel Bakış';
  var per=statsRange==='week'?'Bu haftanın':statsRange==='month'?'Son 30 günün':'Son 12 ayın';
  var ids=Object.keys(zsum).sort(function(a,b){return zsum[b]-zsum[a];}).slice(0,6);
  var top=ids.length?zsum[ids[0]]:1;
  var perf=ids.map(function(id){
    var z=byId(id);var name=z?z.name:'(silinmiş zikir)';
    var w=Math.round(zsum[id]/top*100);
    return '<div class="card flat col" style="gap:7px;padding:12px"><div class="row"><div class="row" style="gap:8px;min-width:0"><i style="width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none"></i>'+
      '<span class="lab" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(name)+'</span></div>'+
      (z&&z.arabic&&z.arabic.length<=28?'<span class="arabic acc" style="font-size:18px;line-height:1.3">'+esc(z.arabic)+'</span>':'')+'</div>'+
      '<div class="row lab-s" style="font-size:12px"><span>'+fmt(zsum[id])+' tekrar</span><span class="acc">'+(z?'Hedef: '+targetsText(z):'')+'</span></div>'+
      '<div class="bar"><i style="width:'+w+'%"></i></div></div>';
  }).join('')||'<div class="empty">Bu aralıkta henüz sayım yok. Zikir çekmeye başlayınca burada görünecek.</div>';
  var st=streak();
  function badge(ic1,t,d,ok,prog){return '<div class="'+(ok?'':'lock')+'"><span class="bi">'+ic(ic1)+'</span><b class="t-sm" style="font-size:15px">'+t+'</b><span class="lab-s">'+d+'</span>'+
    '<span class="pill" style="font-size:11px;background:'+(ok?'color-mix(in srgb,var(--accent) 16%,transparent)':'var(--s4)')+';color:'+(ok?'var(--accent-t)':'var(--var)')+'">'+(ok?ic('check')+' Kazanıldı':ic('lock')+' '+prog)+'</span></div>';}
  if(st>(S.best||0)){S.best=st;save();}
  var best=S.best||0,tl=function(n){return n.toLocaleString('tr-TR');};
  var BL=[];
  [100,1000,10000,50000,100000,500000,1000000].forEach(function(n){
    BL.push({ic:'star',t:n===100?'İlk Adım':tl(n)+' Kulübü',d:n===100?'İlk 100 zikir':tl(n)+' sınırını aşma',ok:S.totals.reps>=n,p:fmt(Math.min(S.totals.reps,n))+' / '+fmt(n)});
  });
  [[7,'Kesintisiz 1 hafta'],[30,'Kesintisiz 30 gün'],[100,'Kesintisiz 100 gün'],[365,'Kesintisiz 1 yıl']].forEach(function(a){
    BL.push({ic:'cal',t:a[0]+' Gün Serisi',d:a[1],ok:best>=a[0],p:Math.min(best,a[0])+' / '+a[0]+' gün'});
  });
  BL.push({ic:'moon',t:'Gece Kuşu',d:'23:00 sonrası tefekkür',ok:!!S.night,p:'Gece zikri çek'});
  var nb=BL.filter(function(b){return b.ok;}).length;
  function sg(k,l){return '<button class="'+(statsRange===k?'on':'')+'" data-a="range" data-id="'+k+'">'+l+'</button>';}
  return '<div class="page">'+
   '<div class="row"><div class="col"><span class="lab-s acc" style="text-transform:uppercase;letter-spacing:.12em">● Huzur Analitiği</span><h1 class="t-lg acc">İstatistikler</h1></div></div>'+
   '<div class="hero" style="padding:16px"><span class="lab-s acc" style="text-transform:uppercase;letter-spacing:.12em">Manevi Ritim</span><p class="t-sm" style="margin-top:3px;max-width:260px">Kalpler ancak Allah’ı anmakla huzur bulur.</p></div>'+
   '<div class="col" style="gap:7px"><div class="row"><span class="lab muted" style="font-size:13px">Bugünkü Özet</span><span class="lab-s acc">Canlı Veri</span></div>'+
   '<div class="s3"><div><span class="ib">'+ic('checkc')+'</span><span class="lab-s">Tamamlanan</span><b class="acc">'+fmt(today().c)+' <small class="lab-s">Adet</small></b></div>'+
   '<div><span class="ib">'+ic('repeat')+'</span><span class="lab-s">Toplam Tekrar</span><b>'+fmt(S.totals.reps)+'</b></div>'+
   '<div><span class="ib">'+ic('flame')+'</span><span class="lab-s">Günlük Seri</span><b>'+st+' <small class="lab-s">Gün</small></b></div></div></div>'+
   '<div class="seg">'+sg('week','Hafta')+sg('month','Ay')+sg('year','Yıl')+'</div>'+
   '<div class="card"><div class="row" style="align-items:flex-start"><div class="col"><span class="t-sm">'+title+'</span><span class="lab-s">'+per+' toplam hacmi: '+fmt(total)+' tekrar</span></div>'+
   (delta!==null?'<span class="pill" style="background:color-mix(in srgb,var(--accent) 18%,transparent)">'+ic('trend')+' '+(delta>=0?'+':'')+delta+'%</span>':'')+'</div>'+
   '<div class="chart">'+bars+'</div></div>'+
   '<div class="col" style="gap:8px"><div class="row"><span class="t-sm">Zikir Performansı & Dağılımı</span><span class="lab-s">'+ids.length+' Aktif Zikir</span></div>'+perf+'</div>'+
   '<div class="col" style="gap:8px"><div class="row"><span class="row t-sm" style="gap:6px">'+ic('star','acc')+' Kazanılan Başarılar</span><span class="lab-s acc">'+nb+' / '+BL.length+' Açıldı</span></div>'+
   '<div class="badges">'+BL.map(function(b){return badge(b.ic,b.t,b.d,b.ok,b.p);}).join('')+'</div></div>'+
   '<div class="note" style="padding:12px">'+ic('clock','acc')+'<span>Günlük veriler her gece 23:50’de arşivlenir; sayaçlar sıfırlanır, istatistikler korunur.</span></div></div>';
}

}

/* ============ olaylar ============ */
function wakeApply(){
  try{
    if(S.set.wake&&route==='count'&&'wakeLock' in navigator&&document.visibilityState==='visible'){
      navigator.wakeLock.request('screen').then(function(l){window.__wl=l;}).catch(function(){});
    }else if(window.__wl){window.__wl.release();window.__wl=null;}
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){if(checkResets())renderAll();wakeApply();}
});
setInterval(function(){if(SORT&&SORT.on)return;if(checkResets()&&route!=='add')renderAll();},30000);


/* ============ basılı tutup sürükleyerek sıralama ============ */
var SORT=null,sortSuppress=0;
function sid(x){return x.getAttribute('data-sid');}
function sortStart(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var item=e.target.closest&&e.target.closest('[data-sid]');if(!item)return;
  var box=item.parentNode;if(!box||!box.getAttribute('data-sort'))return;
  if(e.target.closest('input,textarea,a,.iconbtn'))return;
  if(box.getAttribute('data-sort')==='home'&&e.target.closest('button'))return;
  SORT={item:item,box:box,x:e.clientX,y:e.clientY,cy:e.clientY,on:false};
  SORT.timer=setTimeout(sortBegin,420);
}
function sortBegin(){
  var s=SORT;if(!s)return;
  var main=$('#view');
  s.items=$$('[data-sid]',s.box).filter(function(x){return x.parentNode===s.box;});
  s.rects=s.items.map(function(x){var r=x.getBoundingClientRect();return {top:r.top,h:r.height};});
  s.gap=s.items.length>1?s.rects[1].top-(s.rects[0].top+s.rects[0].h):0;
  s.from=s.items.indexOf(s.item);
  s.newOrder=s.items.map(function(_,i){return i;});
  s.scroll0=main.scrollTop;s.on=true;
  s.items.forEach(function(x){x.style.transition='transform .16s';});
  s.item.style.transition='none';s.item.style.position='relative';s.item.style.zIndex='7';
  s.item.style.boxShadow='0 12px 32px rgba(0,0,0,.55)';s.item.style.outline='2px solid var(--accent)';
  vib(35,true);
  sortAuto();
}
function sortLayout(){
  var s=SORT;if(!s||!s.on)return;
  var main=$('#view');
  var dy=s.cy-s.y+(main.scrollTop-s.scroll0);
  var r=s.rects[s.from],center=r.top+r.h/2+dy;
  var others=[];
  for(var i=0;i<s.items.length;i++){if(i!==s.from)others.push(i);}
  var to=0;
  for(var k=0;k<others.length;k++){var o=s.rects[others[k]];if(center>o.top+o.h/2)to=k+1;}
  var order=others.slice();order.splice(to,0,s.from);
  s.newOrder=order;
  var cur=s.rects[0].top,tops=[];
  order.forEach(function(idx){tops[idx]=cur;cur+=s.rects[idx].h+s.gap;});
  s.items.forEach(function(x,i){
    if(i===s.from)x.style.transform='translateY('+dy+'px)';
    else x.style.transform='translateY('+(tops[i]-s.rects[i].top)+'px)';
  });
}
function sortAuto(){
  var s=SORT;if(!s||!s.on)return;
  var mr=$('#view').getBoundingClientRect(),sp=0;
  if(s.cy<mr.top+90)sp=-Math.min(22,Math.ceil((mr.top+90-s.cy)/5));
  else if(s.cy>mr.bottom-90)sp=Math.min(22,Math.ceil((s.cy-(mr.bottom-90))/5));
  if(sp){$('#view').scrollTop+=sp;sortLayout();}
  s.raf=requestAnimationFrame(sortAuto);
}
function sortMove(e){
  var s=SORT;if(!s)return;
  if(!s.on){
    if(Math.abs(e.clientX-s.x)>10||Math.abs(e.clientY-s.y)>10){clearTimeout(s.timer);SORT=null;}
    return;
  }
  s.cy=e.clientY;sortLayout();
}
function sortEnd(){
  var s=SORT;if(!s)return;
  clearTimeout(s.timer);cancelAnimationFrame(s.raf);
  SORT=null;
  if(!s.on)return;
  sortSuppress=Date.now()+450;
  var ids=s.items.map(sid),newIds=s.newOrder.map(function(i){return ids[i];});
  if(newIds.join()!==ids.join()){
    var slots=ids.map(function(id){return S.zikirs.indexOf(byId(id));}).sort(function(a,b){return a-b;});
    var objs=newIds.map(byId);
    slots.forEach(function(p,k){S.zikirs[p]=objs[k];});
    save();vib(20,true);
  }
  renderAll();
}
document.addEventListener('pointerdown',sortStart);
document.addEventListener('pointermove',sortMove);
document.addEventListener('pointerup',sortEnd);
document.addEventListener('pointercancel',sortEnd);
document.addEventListener('touchmove',function(e){if(SORT&&SORT.on)e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',function(e){if(SORT)e.preventDefault();});
document.addEventListener('click',function(e){if(Date.now()<sortSuppress){e.stopPropagation();e.preventDefault();}},true);

function langPopHtml(){
  return [['tr','TR','Türkçe'],['en','EN','English'],['de','DE','Deutsch']].map(function(x){
    var on=lang()===x[0];
    return '<button class="'+(on?'on':'')+'" data-a="lang" data-id="'+x[0]+'"><span class="row" style="gap:8px"><b>'+x[1]+'</b>'+x[2]+'</span>'+(on?ic('check'):'')+'</button>';
  }).join('');
}
document.addEventListener('click',function(e){
  var pp=$('#langpop');
  if(pp&&!pp.hidden){
    var inside=e.target.closest('#langpop');
    pp.hidden=true;
    if(!inside&&!e.target.closest('[data-a=langMenu]')){return;}   // dışarı tıklama yalnızca menüyü kapatır
    if(!inside&&e.target.closest('[data-a=langMenu]')){return;}    // simgeye tekrar basınca kapanır
  }
  var t=e.target.closest('[data-a]');
  if(t){act(t.getAttribute('data-a'),t.getAttribute('data-id'),e,t);return;}
  if(route==='home'){var zc=e.target.closest('.zc');if(zc&&!e.target.closest('button,a,input,label,textarea')){var zid=zc.getAttribute('data-sid'),zz=byId(zid);if(zz&&!isDone(zz)){act('open',zid,e,zc);return;}}}
  if(route==='count'&&!e.target.closest('button,a,input,label,textarea,.chain,#goto,nav,header')){onCountTap(e);}
});
document.addEventListener('input',function(e){
  if(e.target.id==='vol'){S.set.volume=+e.target.value;$('#volv').textContent='%'+S.set.volume;save();}
  else if(e.target.id==='accPick'){S.set.accent=e.target.value;save();applyTheme();}
  else if(e.target.id==='f-t'){$('#f-tl').textContent=(e.target.value||0)+' Tekrar';}
  else if(e.target.id==='f-note'){$('#f-nc').textContent=e.target.value.length+'/250';}
});
document.addEventListener('change',function(e){
  if(e.target.id==='accPick'){renderAll();}
  else if(e.target.id==='fileImg'||e.target.id==='fileCam'){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var keep=keepFormTexts();
    resizeImg(f,function(url){pendImg=url;renderAll();restoreFormTexts(keep);});
    e.target.value='';
  }else if(e.target.id==='fileImport'){
    var f2=e.target.files&&e.target.files[0];if(!f2)return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var j=JSON.parse(fr.result);var st=j.state||j;
        if(!st||!Array.isArray(st.zikirs)||!st.set)throw new Error('format');
        if(!confirmBox('Mevcut veriler bu yedekle değiştirilecek. Devam edilsin mi?'))return;
        S=st;
        var d=defaultState();for(var k in d){if(!(k in S))S[k]=d[k];}
        for(var q in d.set){if(!(q in S.set))S.set[q]=d.set[q];}
        save();checkResets();renderAll();toast('Yedek geri yüklendi.');
      }catch(err){toast('Bu dosya geçerli bir yedek değil.');}
    };
    fr.readAsText(f2);e.target.value='';
  }
});

function act(a,id,e,el){
  switch(a){
    case 'theme':S.set.theme=S.set.theme==='dark'?'light':'dark';save();renderAll();break;
    case 'langCycle':{var LS=['tr','en','de'],LN={tr:'Türkçe',en:'English',de:'Deutsch'};var nl=LS[(LS.indexOf(lang())+1)%3];S.set.lang=nl;save();renderAll();toast(LN[nl]);break;}
    case 'langMenu':{var pp=$('#langpop');pp.innerHTML=langPopHtml();pp.hidden=false;break;}
    case 'toggleDoneHome':homeDoneOpen=!homeDoneOpen;renderAll();break;
    case 'toggleDoneChain':chainDoneOpen=!chainDoneOpen;renderAll();break;
    case 'lang':S.set.lang=id;save();renderAll();break;
    case 'vibStrength':S.set.vibStrength=id;save();renderAll();vib(endVib(true),true);break;
    case 'vibTest':vib(endVib(true),true);if(!navigator.vibrate)toast('Bu cihaz titreşimi desteklemiyor.');break;
    case 'themeSet':S.set.theme=id;save();renderAll();break;
    case 'accent':S.set.accent=id;save();renderAll();break;
    case 'tapType':S.set.tapType=id;save();renderAll();playTap();break;
    case 'set':
      S.set[id]=!S.set[id];save();renderAll();
      if(id==='wake')wakeApply();
      if(id==='haptic'&&S.set.haptic)vib(40);
      break;
    case 'filter':filter=id;renderAll();break;
    case 'open':S.active=id;save();go('count');break;
    case 'again':
      if(confirmBox('Bu zikrin sayacı sıfırlanıp yeniden açılsın mı?')){S.counts[id]=0;S.active=id;save();go('count');}
      break;
    case 'reset1':{
      var z=byId(id);if(!z||cnt(z)===0)break;
      if(confirmBox('“'+z.name+'” sayacı sıfırlansın mı?')){S.counts[id]=0;save();hideGoto();renderAll();vib([30,30]);}
      break;}
    case 'resetAll':
      if(confirmBox('Tüm zikir sayaçları sıfırlansın mı? (İstatistikler korunur)')){S.zikirs.forEach(function(q){S.counts[q.id]=0;});save();renderAll();toast('Tüm sayaçlar sıfırlandı');}
      break;
    case 'new':editId=null;pendImg=null;go('add');break;
    case 'edit':editId=id;pendImg=null;go('add');break;
    case 'pick':S.active=id;save();renderAll();break;
    case 'auto':S.set.autoAdvance=!S.set.autoAdvance;save();renderAll();break;
    case 'snd':S.set.sound=!S.set.sound;save();renderAll();break;
    case 'prev':case 'next':{
      var L=S.zikirs,i=L.indexOf(active());
      S.active=L[(i+(a==='next'?1:-1)+L.length)%L.length].id;save();hideGoto();renderAll();break;}
    case 'skip':{var nx=nextIncomplete(S.active);if(nx)switchTo(nx.id);else toast('Tüm zikirler tamamlandı');break;}
    case 'gotoCancel':hideGoto();toast('Geçiş bekletildi');break;
    case 'gotoNow':switchTo(id);break;
    case 'chainEdit':chainEdit=!chainEdit;renderAll();break;
    case 'mvup':case 'mvdn':{
      var A=S.zikirs,k=-1;for(var m=0;m<A.length;m++){if(A[m].id===id)k=m;}
      var j=a==='mvup'?k-1:k+1;
      if(k>=0&&j>=0&&j<A.length){var tmp=A[k];A[k]=A[j];A[j]=tmp;save();renderAll();}
      break;}
    case 'range':statsRange=id;renderAll();break;
    case 'stepT':{var inp=$('#f-t');var v=(parseInt(inp.value,10)||0)+(+id);if(v<1)v=1;inp.value=v;$('#f-tl').textContent=v+' Tekrar';break;}
    case 'chipT':$('#f-t').value=id;$('#f-tl').textContent=id+' Tekrar';break;
    case 'swSnd':$('#f-son').classList.toggle('on');break;
    case 'prev-snd':if(id==='vibrate'){if(navigator.vibrate)navigator.vibrate(60);}else{playDone(id,true);if(navigator.vibrate)navigator.vibrate(40);}break;
    case 'cam':$('#fileCam').click();break;
    case 'gal':$('#fileImg').click();break;
    case 'noimg':{var kp=keepFormTexts();pendImg='';renderAll();restoreFormTexts(kp);break;}
    case 'saveZ':saveZ(id==='1');break;
    case 'delZ':{
      var dz=byId(editId);if(!dz)break;
      if(S.zikirs.length<2){toast('En az bir zikir kalmalı.');break;}
      if(confirmBox('“'+dz.name+'” silinsin mi? Geçmiş istatistikler korunur.')){
        S.zikirs=S.zikirs.filter(function(q){return q.id!==dz.id;});
        delete S.counts[dz.id];delete S.period[dz.id];
        if(S.active===dz.id)S.active=S.zikirs[0].id;
        editId=null;pendImg=null;save();toast('Zikir silindi');go('home');
      }
      break;}
    case 'export':{
      try{downloadBlob(backupBlob(),backupName());toast('Yedek dosyası hazırlandı');renderAll();}
      catch(err){toast('Yedek alınamadı.');}
      break;}
    case 'shareBackup':shareBackup();break;
    case 'snoozeBackup':S.backupSnooze=Date.now()+3*86400000;save();renderAll();break;
    case 'import':$('#fileImport').click();break;
    case 'wipe':
      if(confirmBox('Tüm istatistikler (günlük kayıtlar, toplamlar, rozetler) silinsin mi? Bu işlem geri alınamaz.')){
        S.days={};S.totals={reps:0,done:0};S.night=false;S.best=0;S.zikirs.forEach(function(q){S.counts[q.id]=0;});save();renderAll();toast('İstatistikler sıfırlandı');
      }
      break;
    case 'defaults':
      if(confirmBox('Hazır zikir listesi geri yüklensin mi? Eklediğiniz zikirler ve sayaçlar silinir (istatistikler korunur).')){
        S.zikirs=defaultZikirs();S.zl=9;S.counts={};S.period={};S.active='d1';checkResets();save();renderAll();toast('Liste geri yüklendi');
      }
      break;
  }
}

try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}}catch(e){}
checkResets();
if(!location.hash)location.hash='#home';
renderAll();
wakeApply();
window.addEventListener('hashchange',wakeApply);

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
})();
